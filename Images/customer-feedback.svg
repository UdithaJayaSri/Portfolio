<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00c8ff"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.15" r="0.6"><stop offset="0" stop-color="#00c8ff" stop-opacity="0.25"/><stop offset="1" stop-color="#00c8ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.9" r="0.6"><stop offset="0" stop-color="#7c5cff" stop-opacity="0.3"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
    <polygon id="star" points="0,-9 2.6,-3 9,-2.8 4,1.6 5.6,8 0,4.6 -5.6,8 -4,1.6 -9,-2.8 -2.6,-3"/>
  </defs>
  <rect width="800" height="500" fill="#070b14"/>
  <rect width="800" height="500" fill="url(#glowA)"/><rect width="800" height="500" fill="url(#glowB)"/>

  <g transform="translate(50,40)">
    <rect width="700" height="420" rx="18" fill="#0a0f1a" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="24" cy="22" r="5" fill="#ff5f57"/><circle cx="42" cy="22" r="5" fill="#febc2e"/><circle cx="60" cy="22" r="5" fill="#28c840"/>
    <text x="84" y="26" fill="#94a3bb" font-size="12">Customer Feedback</text>
    <line x1="0" y1="44" x2="700" y2="44" stroke="#ffffff" stroke-opacity="0.08"/>

    <!-- rating summary -->
    <g transform="translate(24,64)">
      <rect width="210" height="150" rx="14" fill="#101827"/>
      <text x="20" y="34" fill="#94a3bb" font-size="12">Average rating</text>
      <text x="20" y="80" fill="#eef2fb" font-size="44" font-weight="700">4.6</text>
      <g fill="#febc2e" transform="translate(30,102)">
        <use href="#star" x="0"/><use href="#star" x="24"/><use href="#star" x="48"/><use href="#star" x="72"/>
        <use href="#star" x="96" fill="#febc2e" opacity="0.45"/>
      </g>
      <text x="20" y="134" fill="#94a3bb" font-size="11">Based on recent responses</text>
    </g>

    <!-- distribution -->
    <g transform="translate(24,228)">
      <rect width="210" height="170" rx="14" fill="#101827"/>
      <text x="20" y="30" fill="#94a3bb" font-size="12">Rating breakdown</text>
      <g font-size="11" fill="#94a3bb">
        <text x="20" y="58">5</text><rect x="38" y="50" width="150" height="8" rx="4" fill="#ffffff" fill-opacity="0.07"/><rect x="38" y="50" width="112" height="8" rx="4" fill="url(#g)"/>
        <text x="20" y="80">4</text><rect x="38" y="72" width="150" height="8" rx="4" fill="#ffffff" fill-opacity="0.07"/><rect x="38" y="72" width="70" height="8" rx="4" fill="url(#g)"/>
        <text x="20" y="102">3</text><rect x="38" y="94" width="150" height="8" rx="4" fill="#ffffff" fill-opacity="0.07"/><rect x="38" y="94" width="34" height="8" rx="4" fill="url(#g)"/>
        <text x="20" y="124">2</text><rect x="38" y="116" width="150" height="8" rx="4" fill="#ffffff" fill-opacity="0.07"/><rect x="38" y="116" width="14" height="8" rx="4" fill="url(#g)"/>
        <text x="20" y="146">1</text><rect x="38" y="138" width="150" height="8" rx="4" fill="#ffffff" fill-opacity="0.07"/><rect x="38" y="138" width="8" height="8" rx="4" fill="url(#g)"/>
      </g>
    </g>

    <!-- feedback list -->
    <g transform="translate(250,64)">
      <text x="0" y="14" fill="#eef2fb" font-size="14" font-weight="600">Recent feedback</text>
      <g transform="translate(0,30)">
        <rect width="290" height="74" rx="14" fill="#101827"/>
        <circle cx="34" cy="37" r="18" fill="#3ef2b0" fill-opacity="0.18"/>
        <circle cx="28" cy="32" r="2" fill="#3ef2b0"/><circle cx="40" cy="32" r="2" fill="#3ef2b0"/><path d="M26 41 Q34 49 42 41" stroke="#3ef2b0" stroke-width="2" fill="none" stroke-linecap="round"/>
        <rect x="64" y="22" width="150" height="8" rx="4" fill="#eef2fb" fill-opacity="0.8"/>
        <rect x="64" y="40" width="200" height="6" rx="3" fill="#94a3bb" fill-opacity="0.5"/>
        <rect x="64" y="54" width="120" height="6" rx="3" fill="#94a3bb" fill-opacity="0.35"/>
      </g>
      <g transform="translate(0,114)">
        <rect width="290" height="74" rx="14" fill="#101827"/>
        <circle cx="34" cy="37" r="18" fill="#febc2e" fill-opacity="0.18"/>
        <circle cx="28" cy="32" r="2" fill="#febc2e"/><circle cx="40" cy="32" r="2" fill="#febc2e"/><path d="M26 44 L42 44" stroke="#febc2e" stroke-width="2" stroke-linecap="round"/>
        <rect x="64" y="22" width="120" height="8" rx="4" fill="#eef2fb" fill-opacity="0.8"/>
        <rect x="64" y="40" width="190" height="6" rx="3" fill="#94a3bb" fill-opacity="0.5"/>
        <rect x="64" y="54" width="90" height="6" rx="3" fill="#94a3bb" fill-opacity="0.35"/>
      </g>
      <g transform="translate(0,198)">
        <rect width="290" height="74" rx="14" fill="#101827"/>
        <circle cx="34" cy="37" r="18" fill="#3ef2b0" fill-opacity="0.18"/>
        <circle cx="28" cy="32" r="2" fill="#3ef2b0"/><circle cx="40" cy="32" r="2" fill="#3ef2b0"/><path d="M26 41 Q34 49 42 41" stroke="#3ef2b0" stroke-width="2" fill="none" stroke-linecap="round"/>
        <rect x="64" y="22" width="170" height="8" rx="4" fill="#eef2fb" fill-opacity="0.8"/>
        <rect x="64" y="40" width="180" height="6" rx="3" fill="#94a3bb" fill-opacity="0.5"/>
        <rect x="64" y="54" width="140" height="6" rx="3" fill="#94a3bb" fill-opacity="0.35"/>
      </g>
      <g transform="translate(0,282)">
        <rect width="290" height="52" rx="14" fill="#101827"/>
        <circle cx="34" cy="26" r="14" fill="#ff5f57" fill-opacity="0.2"/>
        <rect x="64" y="16" width="130" height="8" rx="4" fill="#eef2fb" fill-opacity="0.8"/>
        <rect x="64" y="32" width="160" height="6" rx="3" fill="#94a3bb" fill-opacity="0.45"/>
      </g>
    </g>

    <!-- sentiment donut -->
    <g transform="translate(560,64)">
      <rect width="120" height="200" rx="14" fill="#101827"/>
      <text x="16" y="28" fill="#94a3bb" font-size="12">Sentiment</text>
      <g transform="translate(60,100) rotate(-90)">
        <circle r="34" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="12"/>
        <circle r="34" fill="none" stroke="url(#g)" stroke-width="12" stroke-dasharray="150 214" stroke-linecap="round"/>
        <circle r="34" fill="none" stroke="#febc2e" stroke-width="12" stroke-dasharray="30 214" stroke-dashoffset="-158" stroke-linecap="round"/>
      </g>
      <text x="60" y="106" fill="#eef2fb" font-size="16" font-weight="700" text-anchor="middle">70%</text>
      <text x="60" y="168" fill="#94a3bb" font-size="10" text-anchor="middle">Positive</text>
    </g>
    <g transform="translate(560,280)">
      <rect width="120" height="54" rx="14" fill="url(#g)"/>
      <text x="60" y="32" fill="#04121a" font-size="13" font-weight="700" text-anchor="middle">+ Add Survey</text>
    </g>
  </g>
</svg>
