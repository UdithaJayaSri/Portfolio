      <g fill="#94a3bb"><rect x="18" y="108" width="240" height="6" rx="3" fill-opacity="0.5"/><rect x="18" y="124" width="220" height="6" rx="3" fill-opacity="0.4"/><rect x="18" y="140" width="236" height="6" rx="3" fill-opacity="0.4"/><rect x="18" y="156" width="150" height="6" rx="3" fill-opacity="0.3"/></g>
