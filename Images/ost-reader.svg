      <g><rect width="220" height="62" rx="12" fill="#00c8ff" fill-opacity="0.1" stroke="#00c8ff" stroke-opacity="0.4"/><circle cx="22" cy="31" r="12" fill="#00c8ff"/><rect x="44" y="16" width="110" height="8" rx="4" fill="#eef2fb" fill-opacity="0.85"/><rect x="44" y="32" width="150" height="6" rx="3" fill="#94a3bb" fill-opacity="0.5"/><rect x="44" y="45" width="90" height="5" rx="2" fill="#94a3bb" fill-opacity="0.3"/></g>
      <g transform="translate(0,70)"><rect width="220" height="62" rx="12" fill="#101827"/><circle cx="22" cy="31" r="12" fill="#7c5cff"/><rect x="44" y="16" width="90" height="8" rx="4" fill="#eef2fb" fill-opacity="0.85"/><rect x="44" y="32" width="140" height="6" rx="3" fill="#94a3bb" fill-opacity="0.5"/><rect x="44" y="45" width="100" height="5" rx="2" fill="#94a3bb" fill-opacity="0.3"/></g>
      <g transform="translate(0,140)"><rect width="220" height="62" rx="12" fill="#101827"/><circle cx="22" cy="31" r="12" fill="#3ef2b0"/><rect x="44" y="16" width="120" height="8" rx="4" fill="#eef2fb" fill-opacity="0.85"/><rect x="44" y="32" width="130" height="6" rx="3" fill="#94a3bb" fill-opacity="0.5"/><rect x="44" y="45" width="80" height="5" rx="2" fill="#94a3bb" fill-opacity="0.3"/></g>
