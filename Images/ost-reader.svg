        <rect x="20" y="92" width="16" height="11" rx="2" fill="#7c5cff"/><text x="46" y="101">Sent Items</text>
        <rect x="20" y="130" width="16" height="11" rx="2" fill="#febc2e"/><text x="46" y="139">Drafts</text>
