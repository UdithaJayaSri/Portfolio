<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00c8ff"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
    <radialGradient id="glowA" cx="0.2" cy="0.2" r="0.6"><stop offset="0" stop-color="#00c8ff" stop-opacity="0.28"/><stop offset="1" stop-color="#00c8ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.85" r="0.6"><stop offset="0" stop-color="#7c5cff" stop-opacity="0.32"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="500" fill="#070b14"/>
  <rect width="800" height="500" fill="url(#glowA)"/>
  <rect width="800" height="500" fill="url(#glowB)"/>

  <!-- side card left -->
  <g transform="translate(70,120)">
    <rect width="190" height="110" rx="16" fill="#101827" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="18" y="30" fill="#94a3bb" font-size="12">Case Tracking</text>
    <text x="18" y="58" fill="#eef2fb" font-size="20" font-weight="700">In Progress</text>
    <rect x="18" y="76" width="154" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="18" y="76" width="104" height="8" rx="4" fill="url(#g)"/>
  </g>
  <g transform="translate(90,260)">
    <rect width="170" height="70" rx="16" fill="#101827" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="16" y="18" width="34" height="34" rx="9" fill="url(#g)"/>
    <text x="62" y="32" fill="#94a3bb" font-size="11">Documents</text>
    <text x="62" y="50" fill="#eef2fb" font-size="14" font-weight="600">3 uploaded</text>
  </g>

  <!-- phone -->
  <g transform="translate(290,24)">
    <rect width="220" height="452" rx="34" fill="#0b1220" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
    <rect x="80" y="10" width="60" height="6" rx="3" fill="#ffffff" fill-opacity="0.15"/>
    <rect x="14" y="30" width="192" height="60" rx="18" fill="url(#g)"/>
    <text x="30" y="56" fill="#04121a" font-size="11" opacity="0.8">Welcome back</text>
    <text x="30" y="76" fill="#04121a" font-size="16" font-weight="700">My Complaints</text>

    <g transform="translate(14,104)">
      <rect width="192" height="64" rx="14" fill="#141d2e"/>
      <text x="14" y="26" fill="#eef2fb" font-size="12" font-weight="600">Service delay</text>
      <text x="14" y="46" fill="#94a3bb" font-size="10">Ref #1042 · 2 days ago</text>
      <rect x="128" y="16" width="52" height="20" rx="10" fill="#3ef2b0" fill-opacity="0.18"/>
      <text x="154" y="30" fill="#3ef2b0" font-size="10" font-weight="600" text-anchor="middle">Open</text>
    </g>
    <g transform="translate(14,178)">
      <rect width="192" height="64" rx="14" fill="#141d2e"/>
      <text x="14" y="26" fill="#eef2fb" font-size="12" font-weight="600">Document issue</text>
      <text x="14" y="46" fill="#94a3bb" font-size="10">Ref #1038 · 5 days ago</text>
      <rect x="116" y="16" width="64" height="20" rx="10" fill="#febc2e" fill-opacity="0.18"/>
      <text x="148" y="30" fill="#febc2e" font-size="10" font-weight="600" text-anchor="middle">In review</text>
    </g>
    <g transform="translate(14,252)">
      <rect width="192" height="64" rx="14" fill="#141d2e"/>
      <text x="14" y="26" fill="#eef2fb" font-size="12" font-weight="600">Payment query</text>
      <text x="14" y="46" fill="#94a3bb" font-size="10">Ref #1031 · 1 week ago</text>
      <rect x="112" y="16" width="68" height="20" rx="10" fill="#00c8ff" fill-opacity="0.18"/>
      <text x="146" y="30" fill="#00c8ff" font-size="10" font-weight="600" text-anchor="middle">Resolved</text>
    </g>

    <circle cx="176" cy="352" r="24" fill="#ff5f57"/>
    <text x="176" y="357" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">SOS</text>
    <rect x="14" y="336" width="120" height="32" rx="16" fill="url(#g)"/>
    <text x="74" y="357" fill="#04121a" font-size="12" font-weight="700" text-anchor="middle">+ New complaint</text>

    <rect x="14" y="394" width="192" height="44" rx="16" fill="#141d2e"/>
    <circle cx="52" cy="416" r="6" fill="#00c8ff"/><circle cx="110" cy="416" r="6" fill="#ffffff" fill-opacity="0.25"/><circle cx="168" cy="416" r="6" fill="#ffffff" fill-opacity="0.25"/>
  </g>

  <!-- side card right -->
  <g transform="translate(540,110)">
    <rect width="190" height="80" rx="16" fill="#101827" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="18" y="30" fill="#94a3bb" font-size="12">Language</text>
    <rect x="18" y="42" width="40" height="24" rx="12" fill="url(#g)"/><text x="38" y="58" fill="#04121a" font-size="11" font-weight="700" text-anchor="middle">EN</text>
    <rect x="66" y="42" width="40" height="24" rx="12" fill="#ffffff" fill-opacity="0.08"/><text x="86" y="58" fill="#eef2fb" font-size="11" text-anchor="middle">SI</text>
    <rect x="114" y="42" width="40" height="24" rx="12" fill="#ffffff" fill-opacity="0.08"/><text x="134" y="58" fill="#eef2fb" font-size="11" text-anchor="middle">TA</text>
  </g>
  <g transform="translate(540,220)">
    <rect width="190" height="100" rx="16" fill="#101827" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="18" y="30" fill="#94a3bb" font-size="12">Notifications</text>
    <circle cx="30" cy="58" r="6" fill="#3ef2b0"/><text x="44" y="62" fill="#eef2fb" font-size="12">Case updated</text>
    <circle cx="30" cy="80" r="6" fill="#00c8ff"/><text x="44" y="84" fill="#eef2fb" font-size="12">New message</text>
  </g>
</svg>
