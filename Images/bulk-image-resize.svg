<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00c8ff"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b3a5c"/><stop offset="1" stop-color="#0f6f8f"/></linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a2a66"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
    <linearGradient id="t3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f5a4a"/><stop offset="1" stop-color="#3ef2b0"/></linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.15" r="0.6"><stop offset="0" stop-color="#00c8ff" stop-opacity="0.25"/><stop offset="1" stop-color="#00c8ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.9" r="0.6"><stop offset="0" stop-color="#7c5cff" stop-opacity="0.3"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
    <g id="thumbMtn"><polygon points="0,64 26,26 44,46 62,20 92,64" fill="#ffffff" fill-opacity="0.35"/><circle cx="72" cy="16" r="7" fill="#ffffff" fill-opacity="0.55"/></g>
  </defs>
  <rect width="800" height="500" fill="#070b14"/>
  <rect width="800" height="500" fill="url(#glowA)"/><rect width="800" height="500" fill="url(#glowB)"/>

  <g transform="translate(50,40)">
    <rect width="700" height="420" rx="18" fill="#0a0f1a" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="24" cy="22" r="5" fill="#ff5f57"/><circle cx="42" cy="22" r="5" fill="#febc2e"/><circle cx="60" cy="22" r="5" fill="#28c840"/>
    <text x="84" y="26" fill="#94a3bb" font-size="12">Bulk Image Resize</text>
    <line x1="0" y1="44" x2="700" y2="44" stroke="#ffffff" stroke-opacity="0.08"/>

    <!-- drop zone -->
    <g transform="translate(24,62)">
      <rect width="400" height="70" rx="16" fill="#00c8ff" fill-opacity="0.05" stroke="#00c8ff" stroke-opacity="0.5" stroke-dasharray="7 6"/>
      <text x="200" y="34" fill="#eef2fb" font-size="14" font-weight="600" text-anchor="middle">Drop images or a folder here</text>
      <text x="200" y="54" fill="#94a3bb" font-size="11" text-anchor="middle">JPG · PNG · WEBP</text>
    </g>

    <!-- thumbnails -->
    <g transform="translate(24,148)">
      <g><rect width="120" height="84" rx="12" fill="url(#t1)"/><use href="#thumbMtn" x="14" y="8"/><rect x="8" y="60" width="52" height="16" rx="8" fill="#0a0f1a" fill-opacity="0.7"/><text x="34" y="72" fill="#3ef2b0" font-size="9" font-weight="700" text-anchor="middle">Done</text></g>
      <g transform="translate(140,0)"><rect width="120" height="84" rx="12" fill="url(#t2)"/><use href="#thumbMtn" x="14" y="8"/><rect x="8" y="60" width="52" height="16" rx="8" fill="#0a0f1a" fill-opacity="0.7"/><text x="34" y="72" fill="#3ef2b0" font-size="9" font-weight="700" text-anchor="middle">Done</text></g>
      <g transform="translate(280,0)"><rect width="120" height="84" rx="12" fill="url(#t3)"/><use href="#thumbMtn" x="14" y="8"/><rect x="8" y="60" width="62" height="16" rx="8" fill="#0a0f1a" fill-opacity="0.7"/><text x="39" y="72" fill="#00c8ff" font-size="9" font-weight="700" text-anchor="middle">Resizing</text></g>
      <g transform="translate(0,98)"><rect width="120" height="84" rx="12" fill="url(#t2)" opacity="0.7"/><use href="#thumbMtn" x="14" y="8" opacity="0.7"/><rect x="8" y="60" width="54" height="16" rx="8" fill="#0a0f1a" fill-opacity="0.7"/><text x="35" y="72" fill="#94a3bb" font-size="9" font-weight="700" text-anchor="middle">Queued</text></g>
      <g transform="translate(140,98)"><rect width="120" height="84" rx="12" fill="url(#t1)" opacity="0.7"/><use href="#thumbMtn" x="14" y="8" opacity="0.7"/><rect x="8" y="60" width="54" height="16" rx="8" fill="#0a0f1a" fill-opacity="0.7"/><text x="35" y="72" fill="#94a3bb" font-size="9" font-weight="700" text-anchor="middle">Queued</text></g>
      <g transform="translate(280,98)"><rect width="120" height="84" rx="12" fill="url(#t3)" opacity="0.7"/><use href="#thumbMtn" x="14" y="8" opacity="0.7"/><rect x="8" y="60" width="54" height="16" rx="8" fill="#0a0f1a" fill-opacity="0.7"/><text x="35" y="72" fill="#94a3bb" font-size="9" font-weight="700" text-anchor="middle">Queued</text></g>
    </g>

    <!-- progress -->
    <g transform="translate(24,346)">
      <text x="0" y="12" fill="#94a3bb" font-size="11">Processing…</text>
      <rect x="0" y="22" width="400" height="10" rx="5" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="0" y="22" width="272" height="10" rx="5" fill="url(#g)"/>
    </g>

    <!-- settings -->
    <g transform="translate(448,62)">
      <rect width="228" height="336" rx="16" fill="#101827"/>
      <text x="18" y="30" fill="#eef2fb" font-size="14" font-weight="700">Settings</text>
      <text x="18" y="62" fill="#94a3bb" font-size="11">Width</text>
      <rect x="18" y="70" width="192" height="32" rx="10" fill="#0a0f1a" stroke="#ffffff" stroke-opacity="0.12"/><text x="30" y="91" fill="#eef2fb" font-size="12">1280 px</text>
      <text x="18" y="126" fill="#94a3bb" font-size="11">Height</text>
      <rect x="18" y="134" width="192" height="32" rx="10" fill="#0a0f1a" stroke="#ffffff" stroke-opacity="0.12"/><text x="30" y="155" fill="#eef2fb" font-size="12">Auto (keep ratio)</text>
      <text x="18" y="190" fill="#94a3bb" font-size="11">Quality</text>
      <rect x="18" y="204" width="192" height="6" rx="3" fill="#ffffff" fill-opacity="0.1"/><rect x="18" y="204" width="140" height="6" rx="3" fill="url(#g)"/><circle cx="158" cy="207" r="8" fill="#eef2fb"/>
      <text x="18" y="238" fill="#94a3bb" font-size="11">Output</text>
      <rect x="18" y="246" width="192" height="32" rx="10" fill="#0a0f1a" stroke="#ffffff" stroke-opacity="0.12"/><text x="30" y="267" fill="#eef2fb" font-size="12">/resized</text>
      <rect x="18" y="292" width="192" height="30" rx="15" fill="url(#g)"/><text x="114" y="312" fill="#04121a" font-size="13" font-weight="700" text-anchor="middle">Resize All</text>
    </g>
  </g>
</svg>
