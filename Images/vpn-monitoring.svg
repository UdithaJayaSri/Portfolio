<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00c8ff"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c5cff" stop-opacity="0.4"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.15" r="0.6"><stop offset="0" stop-color="#00c8ff" stop-opacity="0.25"/><stop offset="1" stop-color="#00c8ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.9" r="0.6"><stop offset="0" stop-color="#7c5cff" stop-opacity="0.3"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="500" fill="#070b14"/>
  <rect width="800" height="500" fill="url(#glowA)"/><rect width="800" height="500" fill="url(#glowB)"/>

  <g transform="translate(50,40)">
    <rect width="700" height="420" rx="18" fill="#0a0f1a" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="24" cy="22" r="5" fill="#ff5f57"/><circle cx="42" cy="22" r="5" fill="#febc2e"/><circle cx="60" cy="22" r="5" fill="#28c840"/>
    <text x="84" y="26" fill="#94a3bb" font-size="12">VPN Monitoring</text>
    <circle cx="640" cy="22" r="5" fill="#3ef2b0"/><text x="652" y="26" fill="#3ef2b0" font-size="11" font-weight="600">LIVE</text>
    <line x1="0" y1="44" x2="700" y2="44" stroke="#ffffff" stroke-opacity="0.08"/>

    <!-- status tiles -->
    <g font-size="11">
      <g transform="translate(24,62)"><rect width="150" height="66" rx="14" fill="#101827"/><text x="16" y="26" fill="#94a3bb">Tunnels</text><text x="16" y="52" fill="#3ef2b0" font-size="20" font-weight="700">Connected</text></g>
      <g transform="translate(186,62)"><rect width="150" height="66" rx="14" fill="#101827"/><text x="16" y="26" fill="#94a3bb">Active users</text><text x="16" y="52" fill="#eef2fb" font-size="20" font-weight="700">Online</text></g>
      <g transform="translate(348,62)"><rect width="150" height="66" rx="14" fill="#101827"/><text x="16" y="26" fill="#94a3bb">Throughput</text><text x="16" y="52" fill="#00c8ff" font-size="20" font-weight="700">Healthy</text></g>
      <g transform="translate(510,62)"><rect width="166" height="66" rx="14" fill="#101827"/><text x="16" y="26" fill="#94a3bb">Security alerts</text><text x="16" y="52" fill="#febc2e" font-size="20" font-weight="700">Watching</text></g>
    </g>

    <!-- topology -->
    <g transform="translate(24,144)">
      <rect width="300" height="258" rx="16" fill="#101827"/>
      <text x="18" y="28" fill="#eef2fb" font-size="13" font-weight="600">Tunnel Map</text>
      <!-- links -->
      <g stroke="#00c8ff" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="5 5" fill="none">
        <path d="M150 140 L60 80"/><path d="M150 140 L240 84"/><path d="M150 140 L58 202"/><path d="M150 140 L246 204"/>
      </g>
      <!-- hub -->
      <circle cx="150" cy="140" r="30" fill="#7c5cff" fill-opacity="0.2"/>
      <circle cx="150" cy="140" r="20" fill="url(#g)"/>
      <path d="M143 142 v-5 a7 7 0 0 1 14 0 v5" stroke="#04121a" stroke-width="2.4" fill="none"/><rect x="141" y="141" width="18" height="12" rx="3" fill="#04121a"/>
      <!-- sites -->
      <g>
        <circle cx="60" cy="80" r="14" fill="#3ef2b0"/><text x="60" y="110" fill="#94a3bb" font-size="10" text-anchor="middle">Branch 1</text>
        <circle cx="240" cy="84" r="14" fill="#3ef2b0"/><text x="240" y="114" fill="#94a3bb" font-size="10" text-anchor="middle">Branch 2</text>
        <circle cx="58" cy="202" r="14" fill="#febc2e"/><text x="58" y="232" fill="#94a3bb" font-size="10" text-anchor="middle">Remote</text>
        <circle cx="246" cy="204" r="14" fill="#3ef2b0"/><text x="246" y="234" fill="#94a3bb" font-size="10" text-anchor="middle">Branch 3</text>
      </g>
    </g>

    <!-- traffic -->
    <g transform="translate(340,144)">
      <rect width="336" height="118" rx="16" fill="#101827"/>
      <text x="18" y="26" fill="#eef2fb" font-size="13" font-weight="600">VPN Traffic</text>
      <path d="M18 92 L60 76 L102 84 L144 58 L186 66 L228 44 L270 58 L318 40 L318 100 L18 100 Z" fill="url(#area)"/>
      <path d="M18 92 L60 76 L102 84 L144 58 L186 66 L228 44 L270 58 L318 40" fill="none" stroke="url(#g)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="318" cy="40" r="4.5" fill="#00c8ff"/>
    </g>

    <!-- sessions -->
    <g transform="translate(340,274)">
      <rect width="336" height="128" rx="16" fill="#101827"/>
      <text x="18" y="26" fill="#eef2fb" font-size="13" font-weight="600">Sessions</text>
      <g font-size="11" fill="#c5d0e4">
        <circle cx="26" cy="50" r="5" fill="#3ef2b0"/><text x="40" y="54">Remote user · Site-to-site</text><text x="318" y="54" fill="#3ef2b0" text-anchor="end">Connected</text>
        <circle cx="26" cy="74" r="5" fill="#3ef2b0"/><text x="40" y="78">Branch 2 · IPsec tunnel</text><text x="318" y="78" fill="#3ef2b0" text-anchor="end">Connected</text>
        <circle cx="26" cy="98" r="5" fill="#febc2e"/><text x="40" y="102">Remote · Reconnecting</text><text x="318" y="102" fill="#febc2e" text-anchor="end">Unstable</text>
      </g>
    </g>
  </g>
</svg>
