<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00c8ff"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.15" r="0.6"><stop offset="0" stop-color="#00c8ff" stop-opacity="0.25"/><stop offset="1" stop-color="#00c8ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.9" r="0.6"><stop offset="0" stop-color="#7c5cff" stop-opacity="0.3"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="500" fill="#070b14"/>
  <rect width="800" height="500" fill="url(#glowA)"/><rect width="800" height="500" fill="url(#glowB)"/>

  <g transform="translate(50,40)">
    <rect width="700" height="420" rx="18" fill="#0a0f1a" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="24" cy="22" r="5" fill="#ff5f57"/><circle cx="42" cy="22" r="5" fill="#febc2e"/><circle cx="60" cy="22" r="5" fill="#28c840"/>
    <text x="84" y="26" fill="#94a3bb" font-size="12">Meeting Management</text>
    <line x1="0" y1="44" x2="700" y2="44" stroke="#ffffff" stroke-opacity="0.08"/>

    <!-- schedule -->
    <text x="28" y="80" fill="#eef2fb" font-size="15" font-weight="700">Today's Schedule</text>
    <g transform="translate(28,98)" font-size="12">
      <g><text x="0" y="22" fill="#94a3bb" font-size="11">09:00</text><rect x="52" y="0" width="6" height="52" rx="3" fill="#00c8ff"/><rect x="66" y="0" width="290" height="52" rx="12" fill="#101827"/><text x="82" y="22" fill="#eef2fb" font-weight="600">Project Kick-off</text><text x="82" y="40" fill="#94a3bb" font-size="10">Boardroom · 6 attendees</text></g>
      <g transform="translate(0,64)"><text x="0" y="22" fill="#94a3bb" font-size="11">11:00</text><rect x="52" y="0" width="6" height="52" rx="3" fill="#7c5cff"/><rect x="66" y="0" width="290" height="52" rx="12" fill="#101827"/><text x="82" y="22" fill="#eef2fb" font-weight="600">Weekly Review</text><text x="82" y="40" fill="#94a3bb" font-size="10">Room B · 4 attendees</text></g>
      <g transform="translate(0,128)"><text x="0" y="22" fill="#94a3bb" font-size="11">14:00</text><rect x="52" y="0" width="6" height="52" rx="3" fill="#3ef2b0"/><rect x="66" y="0" width="290" height="52" rx="12" fill="#101827"/><text x="82" y="22" fill="#eef2fb" font-weight="600">Client Demo</text><text x="82" y="40" fill="#94a3bb" font-size="10">Online · 8 attendees</text></g>
      <g transform="translate(0,192)"><text x="0" y="22" fill="#94a3bb" font-size="11">16:30</text><rect x="52" y="0" width="6" height="52" rx="3" fill="#febc2e"/><rect x="66" y="0" width="290" height="52" rx="12" fill="#101827"/><text x="82" y="22" fill="#eef2fb" font-weight="600">Team Retrospective</text><text x="82" y="40" fill="#94a3bb" font-size="10">Room A · 10 attendees</text></g>
    </g>

    <!-- next meeting card -->
    <g transform="translate(410,64)">
      <rect width="262" height="196" rx="16" fill="#101827" stroke="#00c8ff" stroke-opacity="0.35"/>
      <rect x="18" y="18" width="70" height="22" rx="11" fill="#00c8ff" fill-opacity="0.16"/><text x="53" y="33" fill="#00c8ff" font-size="10" font-weight="700" text-anchor="middle">UP NEXT</text>
      <text x="18" y="66" fill="#eef2fb" font-size="16" font-weight="700">Project Kick-off</text>
      <text x="18" y="86" fill="#94a3bb" font-size="11">Today · 09:00 – 10:00 · Boardroom</text>
      <text x="18" y="116" fill="#94a3bb" font-size="11">Attendees</text>
      <g>
        <circle cx="30" cy="140" r="14" fill="#00c8ff"/><circle cx="54" cy="140" r="14" fill="#7c5cff"/><circle cx="78" cy="140" r="14" fill="#3ef2b0"/><circle cx="102" cy="140" r="14" fill="#febc2e"/>
        <circle cx="126" cy="140" r="14" fill="#1b2538" stroke="#ffffff" stroke-opacity="0.2"/><text x="126" y="144" fill="#eef2fb" font-size="10" font-weight="700" text-anchor="middle">+2</text>
      </g>
      <rect x="18" y="164" width="110" height="20" rx="10" fill="url(#g)"/><text x="73" y="178" fill="#04121a" font-size="11" font-weight="700" text-anchor="middle">Open Agenda</text>
    </g>

    <!-- agenda / minutes -->
    <g transform="translate(410,276)">
      <rect width="262" height="118" rx="16" fill="#101827"/>
      <text x="18" y="28" fill="#eef2fb" font-size="13" font-weight="600">Agenda &amp; Minutes</text>
      <g font-size="11" fill="#94a3bb">
        <rect x="18" y="44" width="12" height="12" rx="3" fill="#3ef2b0"/><text x="38" y="54">Welcome &amp; objectives</text>
        <rect x="18" y="66" width="12" height="12" rx="3" fill="#3ef2b0"/><text x="38" y="76">Scope and timeline</text>
        <rect x="18" y="88" width="12" height="12" rx="3" fill="none" stroke="#94a3bb"/><text x="38" y="98">Action items</text>
      </g>
    </g>
